<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PulseBoard Collaborative</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link

            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>

                    extend: {

                        },
                        colors: {
                            sand: {

                                900: "#241d17",

                    },

        <link rel="stylesheet" href="/style.css" />

    <body class="min-h-screen bg-[radial-gradient(circle_at_top_left,rgba(214,90,49,0.18),transparent_26%),radial-gradient(circle_at_bottom_right,rgba(43,122,120,0.18),transparent_22%),linear-gradient(135deg,#f7efe4,#efe6d6_48%,#f8f3eb)] text-sand-900">
